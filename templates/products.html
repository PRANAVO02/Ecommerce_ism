<h2>Products</h2>

<form method="get">
  <input name="q" placeholder="Search product">
  <button type="submit">Search</button>
</form>

<ul>
{% for p in products %}
  <li>
    {{ p[1] }} - ₹{{ p[3] }}
    <a href="/add_to_cart?id={{ p[0] }}&price={{ p[3] }}">Add to Cart</a>
  </li>
{% endfor %}
</ul>
