<!DOCTYPE html>
<html>
<head>
  <title>My Orders | SecureShop</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="container">
    <h2>Orders</h2>

    <div class="card">
      <table>
        <tr>
          <th>Order ID</th>
          <th>Total</th>
          <th>Status</th>
        </tr>

        {% for o in orders %}
        <tr>
          <td>{{ o[0] }}</td>
          <td>₹{{ o[2] }}</td>
          <td>{{ o[3] }}</td>
        </tr>
        {% endfor %}
      </table>
    </div>

    <a href="/products" class="link">← Back</a>
  </div>

</body>
</html>
